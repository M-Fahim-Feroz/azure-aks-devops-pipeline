name: Deploy to AKS (API + Celery)

on:
  push:
    branches:
      - main
      - shahzaib-dev
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: fastapi

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & Test
  # ---------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required GitHub secrets
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          missing=0

          for name in AZURE_CREDENTIALS ACR_NAME ACR_LOGIN_SERVER AKS_CLUSTER_NAME AZURE_RESOURCE_GROUP POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD WEATHER_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty. Add it in GitHub repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required GitHub secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install flake8 pytest
          pip install -r api/requirements.txt

      - name: Linting (Flake8)
        run: flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # ---------------------------------------------------------------------
  # 2. Infrastructure Provisioning (Terraform)
  # ---------------------------------------------------------------------
  provision-infra:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      storage_account_name: ${{ steps.tf-outputs.outputs.storage_account_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Required for proper output parsing

      - name: Extract ARM Credentials
        id: arm-creds
        run: |
          # The ubuntu-latest runner includes jq by default
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra
        run: |
          echo "Deploying AKS cluster: ${{ secrets.AKS_CLUSTER_NAME }}"
          echo "Resource group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "ACR name: ${{ secrets.ACR_NAME }}"
          terraform apply -auto-approve \
            -var="aks_name=${{ secrets.AKS_CLUSTER_NAME }}" \
            -var="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}"

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ./infra
        run: |
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------
  # 3. Docker Build & Push
  # ---------------------------------------------------------------------
  docker-build:
    needs: [provision-infra]  # Wait for ACR to be created by Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/api:latest

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          # Worker uses same image base, just different CMD
          push: true
          tags: ${{ env.REGISTRY }}/worker:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/worker:latest

  # ---------------------------------------------------------------------
  # 4. Configuration & Deployment (Ansible + K8s)
  # ---------------------------------------------------------------------
  deploy-app:
    needs: [docker-build, provision-infra]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Ensure Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes Secrets
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: fastapi-secrets
          string-data: '{"POSTGRES_DB": "${{ secrets.POSTGRES_DB }}", "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}", "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}", "DATABASE_URL": "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}", "CELERY_BROKER_URL": "redis://redis:6379/0", "CELERY_RESULT_BACKEND": "redis://redis:6379/0", "WEATHER_API_KEY": "${{ secrets.WEATHER_API_KEY }}"}'

      - name: Fetch Storage Key & Mask
        id: get-storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ needs.provision-infra.outputs.storage_account_name }} --query '[0].value' -o tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "key=$STORAGE_KEY" >> $GITHUB_OUTPUT

      - name: Create Azure Storage Secret
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: azure-secret
          string-data: '{"azurestorageaccountname": "${{ needs.provision-infra.outputs.storage_account_name }}", "azurestorageaccountkey": "${{ steps.get-storage-key.outputs.key }}"}'


      - name: Run Ansible Playbook
        # We run Ansible to apply the manifests.
        # This satisfies "Ansible deploy or kubectl apply"
        run: |
          pip install ansible kubernetes openshift
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml -e "grafana_password=${{ secrets.POSTGRES_PASSWORD }}"

      - name: Force Restart (Ensures latest image pull)
        run: |
          kubectl rollout restart deployment/fastapi-api -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/fastapi-worker -n ${{ env.NAMESPACE }}

  # ---------------------------------------------------------------------
  # 5. Post-Deploy Smoke Tests
  # ---------------------------------------------------------------------
  smoke-test:
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Debug - Show Pod Status
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Pod Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
          echo ""
          echo "=== API Pod Logs ==="
          kubectl logs deployment/fastapi-api -n ${{ env.NAMESPACE }} --tail=30 || echo "No logs available"
          echo ""
          echo "=== PostgreSQL Pod Logs ==="
          kubectl logs statefulset/postgres -n ${{ env.NAMESPACE }} --tail=20 || echo "No logs available"

      - name: Verify Endpoints
        run: |
          echo "Waiting for pods to be ready..."
          sleep 60
          echo "=== Service Status ==="
          kubectl get svc -n ${{ env.NAMESPACE }}
          EXTERNAL_IP=$(kubectl get service fastapi-service -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Checking Health at http://$EXTERNAL_IP/"
          curl -f --connect-timeout 10 --max-time 30 http://$EXTERNAL_IP/ || echo "Health check failed - see debug logs above"
          echo "Smoke Test Complete!"
