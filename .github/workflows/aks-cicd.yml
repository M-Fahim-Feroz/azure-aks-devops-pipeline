name: Deploy to AKS (API + Celery)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: fastapi

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & Test
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate required GitHub secrets
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0

          for name in AZURE_CREDENTIALS ACR_NAME ACR_LOGIN_SERVER AKS_CLUSTER_NAME AZURE_RESOURCE_GROUP POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD WEATHER_API_KEY GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing or empty. Add it in GitHub repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required GitHub secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install Dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install flake8 bandit pytest
          pip install -r api/requirements.txt

      - name: Linting (Flake8)
        run: |
          set -euo pipefail
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan (Bandit)
        run: |
          set -euo pipefail
          bandit -r api/ -lll --exclude api/tests/

      - name: Run Unit Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"
          WEATHER_API_KEY: "test-key"
        run: |
          set -euo pipefail
          pytest api/tests/ -v --tb=short

  # ---------------------------------------------------------------------
  # 2. Infrastructure Provisioning (Terraform)
  # ---------------------------------------------------------------------
  provision-infra:
    name: Provision Infrastructure (Terraform)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      storage_account_name: ${{ steps.tf-outputs.outputs.storage_account_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Extract ARM Credentials
        id: arm-creds
        run: |
          set -euo pipefail
          # Parse AZURE_CREDENTIALS JSON and export as ARM_ env vars for Terraform.
          # Values are masked by GitHub Actions secrets mechanism.
          CREDS='${{ secrets.AZURE_CREDENTIALS }}'
          echo "ARM_CLIENT_ID=$(echo "$CREDS" | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo "$CREDS" | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo "$CREDS" | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo "$CREDS" | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra
        run: |
          set -euo pipefail
          terraform apply -auto-approve \
            -var="aks_name=${{ secrets.AKS_CLUSTER_NAME }}" \
            -var="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}"

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ./infra
        run: |
          set -euo pipefail
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------
  # 3. Docker Build & Push
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push to ACR
    needs: [provision-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/worker:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 4. Configuration & Deployment (Ansible + K8s)
  # ---------------------------------------------------------------------
  deploy-app:
    name: Deploy Application (Ansible)
    needs: [docker-build, provision-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Ensure Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes Secrets
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: fastapi-secrets
          string-data: |-
            {
              "POSTGRES_DB": "${{ secrets.POSTGRES_DB }}",
              "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}",
              "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}",
              "DATABASE_URL": "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}",
              "CELERY_BROKER_URL": "redis://redis:6379/0",
              "CELERY_RESULT_BACKEND": "redis://redis:6379/0",
              "WEATHER_API_KEY": "${{ secrets.WEATHER_API_KEY }}"
            }

      - name: Fetch Storage Key & Mask
        id: get-storage-key
        run: |
          set -euo pipefail
          STORAGE_KEY=$(az storage account keys list \
            -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
            -n ${{ needs.provision-infra.outputs.storage_account_name }} \
            --query '[0].value' -o tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "key=$STORAGE_KEY" >> $GITHUB_OUTPUT

      - name: Create Azure Storage Secret
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: azure-secret
          string-data: |-
            {
              "azurestorageaccountname": "${{ needs.provision-infra.outputs.storage_account_name }}",
              "azurestorageaccountkey": "${{ steps.get-storage-key.outputs.key }}"
            }

      - name: Run Ansible Playbook
        run: |
          set -euo pipefail
          pip install --quiet ansible kubernetes openshift
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml \
            -e "grafana_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

      - name: Force Restart (Ensures latest image pull)
        run: |
          set -euo pipefail
          kubectl rollout restart deployment/fastapi-api -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/fastapi-worker -n ${{ env.NAMESPACE }}

      - name: Wait for Rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/fastapi-api -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/fastapi-worker -n ${{ env.NAMESPACE }} --timeout=120s

  # ---------------------------------------------------------------------
  # 5. Post-Deploy Smoke Tests
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Show Pod Status
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Service Status ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Show Debug Logs on Failure
        if: failure()
        run: |
          echo "=== Pod Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
          echo ""
          echo "=== API Pod Logs ==="
          kubectl logs deployment/fastapi-api -n ${{ env.NAMESPACE }} --tail=50 || echo "No logs available"
          echo ""
          echo "=== PostgreSQL Pod Logs ==="
          kubectl logs statefulset/postgres -n ${{ env.NAMESPACE }} --tail=20 || echo "No logs available"

      - name: Verify Endpoint
        run: |
          set -euo pipefail

          echo "Waiting for LoadBalancer IP to be assigned..."
          for i in $(seq 1 12); do
            EXTERNAL_IP=$(kubectl get service fastapi-service \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$EXTERNAL_IP" ]; then
              echo "LoadBalancer IP: $EXTERNAL_IP"
              break
            fi
            echo "Attempt $i/12: IP not yet assigned, waiting 10s..."
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "::error::No external IP assigned to fastapi-service LoadBalancer after 120s."
            kubectl get svc -n "$NAMESPACE"
            exit 1
          fi

          echo "Running health check against http://$EXTERNAL_IP/"
          curl \
            --fail \
            --retry 10 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            "http://$EXTERNAL_IP/"

          echo "Smoke test passed!"
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
