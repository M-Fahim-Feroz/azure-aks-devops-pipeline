name: Deploy to AKS (API + Celery)

# TODO: For production-grade supply-chain security, pin third-party GitHub Actions to full commit SHAs.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: fastapi

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & Test
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate required GitHub secrets
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          TF_STATE_RG: ${{ secrets.TF_STATE_RG }}
          TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0

          check_secret() {
            local name="$1"
            local hint="${2:-}"
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is missing or empty.${hint:+ $hint}"
              missing=1
            fi
          }

          check_secret AZURE_CREDENTIALS "Add it under GitHub Repository Settings -> Secrets and variables -> Actions."
          check_secret ACR_NAME "Set to: fahimaksdevopsacr"
          check_secret ACR_LOGIN_SERVER "Set to: fahimaksdevopsacr.azurecr.io"
          check_secret AKS_CLUSTER_NAME
          check_secret AZURE_RESOURCE_GROUP
          check_secret POSTGRES_DB
          check_secret POSTGRES_USER
          check_secret POSTGRES_PASSWORD
          check_secret WEATHER_API_KEY
          check_secret GRAFANA_ADMIN_PASSWORD
          check_secret AZURE_STORAGE_ACCOUNT_NAME "This must be the Azure Storage Account name used for the PostgreSQL file share. See README for setup."
          check_secret TF_STATE_RG "This must be the Resource Group containing the Terraform remote state storage account. See README -> Terraform Remote State Setup."
          check_secret TF_STATE_STORAGE_ACCOUNT "This must be the Azure Storage Account used for Terraform remote state. See README -> Terraform Remote State Setup."

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required GitHub secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install Dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install flake8 bandit pytest
          pip install -r api/requirements.txt

      - name: Linting (Flake8)
        run: |
          set -euo pipefail
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan (Bandit)
        run: |
          set -euo pipefail
          bandit -r api/ -lll --exclude api/tests/

      - name: Run Unit Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"
          WEATHER_API_KEY: "test-key"
        run: |
          set -euo pipefail
          pytest api/tests/ -v --tb=short

  # ---------------------------------------------------------------------
  # 2. Detect infra changes
  # ---------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  # ---------------------------------------------------------------------
  # 3. Infrastructure Provisioning (Terraform)
  # ---------------------------------------------------------------------
  provision-infra:
    name: Provision Infrastructure (Terraform)
    needs: [build-and-test, detect-changes]
    if: needs.detect-changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Extract ARM Credentials
        run: |
          set -euo pipefail
          CREDS='${{ secrets.AZURE_CREDENTIALS }}'
          echo "ARM_CLIENT_ID=$(echo "$CREDS" | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo "$CREDS" | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo "$CREDS" | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo "$CREDS" | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Terraform Init (Remote Backend)
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure-aks-devops-pipeline.tfstate" \
            -input=false

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: State Sanity Check
        working-directory: ./infra
        run: |
          set -euo pipefail
          # Count lines in state list
          STATE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo 0)
          if [ "$STATE_COUNT" -eq 0 ]; then
            echo "Terraform state is empty."
            # Check if the Resource Group exists in Azure
            if az group show --name "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
              echo "::error::Remote Terraform state is empty but Azure resources already exist. Run the one-time state import workflow or scripts/import-terraform-state.ps1 before running terraform apply."
              exit 1
            fi
          else
            echo "Terraform state contains $STATE_COUNT resources."
          fi

      - name: Terraform Apply
        working-directory: ./infra
        run: |
          set -euo pipefail
          terraform apply -auto-approve \
            -var="aks_name=${{ secrets.AKS_CLUSTER_NAME }}" \
            -var="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -var="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
            -input=false

  # ---------------------------------------------------------------------
  # 4. Docker Build & Push
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push to ACR
    needs: [build-and-test, detect-changes, provision-infra]
    # Always run if build passes — provision-infra may be skipped when no infra changes
    if: always() && needs.build-and-test.result == 'success' && (needs.provision-infra.result == 'success' || needs.provision-infra.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/worker:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 5. Configuration & Deployment (Ansible + K8s)
  # ---------------------------------------------------------------------
  deploy-app:
    name: Deploy Application (Ansible)
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Ensure Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes Secrets
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: fastapi-secrets
          string-data: |-
            {
              "POSTGRES_DB": "${{ secrets.POSTGRES_DB }}",
              "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}",
              "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}",
              "DATABASE_URL": "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}",
              "CELERY_BROKER_URL": "redis://redis:6379/0",
              "CELERY_RESULT_BACKEND": "redis://redis:6379/0",
              "WEATHER_API_KEY": "${{ secrets.WEATHER_API_KEY }}"
            }

      - name: Fetch Storage Key & Mask
        id: get-storage-key
        run: |
          set -euo pipefail
          STORAGE_KEY=$(az storage account keys list \
            -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
            -n ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --query '[0].value' -o tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "key=$STORAGE_KEY" >> $GITHUB_OUTPUT

      - name: Create Azure Storage Secret
        uses: azure/k8s-create-secret@v4
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-type: 'generic'
          secret-name: azure-secret
          string-data: |-
            {
              "azurestorageaccountname": "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}",
              "azurestorageaccountkey": "${{ steps.get-storage-key.outputs.key }}"
            }

      - name: Run Ansible Playbook
        run: |
          set -euo pipefail
          pip install --quiet ansible kubernetes openshift
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml \
            -e "grafana_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

      - name: Force Restart (Ensures latest image pull)
        run: |
          set -euo pipefail
          kubectl rollout restart deployment/fastapi-api -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/fastapi-worker -n ${{ env.NAMESPACE }}

      - name: Wait for Rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/fastapi-api -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/fastapi-worker -n ${{ env.NAMESPACE }} --timeout=120s

  # ---------------------------------------------------------------------
  # 6. Post-Deploy Smoke Tests
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Show Pod Status
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Service Status ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Show Debug Logs on Failure
        if: failure()
        run: |
          echo "=== Pod Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
          echo ""
          echo "=== API Pod Logs ==="
          kubectl logs deployment/fastapi-api -n ${{ env.NAMESPACE }} --tail=50 || echo "No logs available"
          echo ""
          echo "=== PostgreSQL Pod Logs ==="
          kubectl logs statefulset/postgres -n ${{ env.NAMESPACE }} --tail=20 || echo "No logs available"

      - name: Verify Endpoint
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail

          echo "Waiting for LoadBalancer IP to be assigned..."
          for i in $(seq 1 12); do
            EXTERNAL_IP=$(kubectl get service fastapi-service \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$EXTERNAL_IP" ]; then
              echo "LoadBalancer IP: $EXTERNAL_IP"
              break
            fi
            echo "Attempt $i/12: IP not yet assigned, waiting 10s..."
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "::error::No external IP assigned to fastapi-service LoadBalancer after 120s."
            kubectl get svc -n "$NAMESPACE"
            exit 1
          fi

          echo "Running health check against http://$EXTERNAL_IP/"
          curl \
            --fail \
            --retry 10 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            "http://$EXTERNAL_IP/"

          echo "Smoke test passed!"
